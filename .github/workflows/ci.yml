name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: gym_nexus
          # Throwaway runner-local container: no password needed
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gym_nexus
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U gym_nexus"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://gym_nexus@localhost:15432/gym_nexus
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Create schema
        run: bunx drizzle-kit push --force < /dev/null
      - name: Test
        run: bunx vitest run

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Typecheck (app + test code)
        run: |
          status=0
          for app in admin-web member-app coach-app; do
            code=0
            (cd "apps/$app" && bunx nuxi typecheck) > "/tmp/tc-$app.log" 2>&1 || code=$?
            if [ "$code" -ne 0 ] && ! grep -q "error TS" "/tmp/tc-$app.log"; then
              echo "::error::$app typecheck crashed (exit $code) without reporting type errors"
              tail -30 "/tmp/tc-$app.log"
              status=1
              continue
            fi
            grep "error TS" "/tmp/tc-$app.log" >"/tmp/tc-$app.txt" || true
            if [ -s "/tmp/tc-$app.txt" ]; then
              echo "::error::$app has $(wc -l < /tmp/tc-$app.txt) type errors"
              cat "/tmp/tc-$app.txt"
              status=1
            fi
          done
          exit $status
      - name: Test
        run: bunx vitest run
      - name: Build
        run: bun run build

  # Playwright against a live backend on a freshly seeded database.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [admin-web, member-app, coach-app]
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: gym_nexus
          # Throwaway runner-local container: no password needed
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gym_nexus
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U gym_nexus"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://gym_nexus@localhost:15432/gym_nexus
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Backend install, schema, seed
        working-directory: backend
        run: |
          bun install --frozen-lockfile
          bunx drizzle-kit push --force < /dev/null
          bun run db:seed
      - name: Start backend
        working-directory: backend
        env:
          ENABLE_CRON: 'false'
          # The suite logs in ~50 times; production login limits (5/15 min) would lock it out
          RELAX_RATE_LIMITS: 'true'
        run: |
          nohup bunx tsx src/app.ts > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8056/health && echo && exit 0; sleep 2; done
          echo "::error::backend did not become healthy"
          cat /tmp/backend.log
          exit 1
      - name: Frontend install
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Install Playwright browser
        working-directory: frontend
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi
      - name: Playwright (${{ matrix.app }})
        working-directory: frontend
        # Leave time for the report upload: a job-level timeout cancels it
        timeout-minutes: 20
        env:
          CI: 'true'
          E2E_APPS: ${{ matrix.app }}
        run: bunx playwright test --project=${{ matrix.app }}
      - name: Backend log
        if: failure()
        run: |
          tail -200 /tmp/backend.log
          mkdir -p frontend/test-results && cp /tmp/backend.log frontend/test-results/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.app }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  hr-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: hr-business-logic (build + test)
        working-directory: backend/packages/hr-business-logic
        run: |
          bun install --frozen-lockfile
          bun run build
          bunx vitest run
      - name: hr-service (install, typecheck/build, test)
        working-directory: hr-service
        run: |
          bun install --frozen-lockfile
          bun run build
          bunx vitest run

  # Build the production images and start them: install/symlink/dependency
  # problems in images often only show up at startup, not at build time.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: gym_nexus
          # Throwaway runner-local container: no password needed
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gym_nexus
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U gym_nexus"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t gym-api:ci backend
          docker build -f hr-service/docker/Dockerfile -t hr-api:ci .
      - name: Start images and check health
        run: |
          db=postgresql://gym_nexus@localhost:15432/gym_nexus
          # Distinct random secrets: production refuses missing/short/shared JWT secrets (#9)
          docker run -d --name api --network host -e DATABASE_URL=$db \
            -e MEMBER_JWT_SECRET="$(openssl rand -hex 32)" \
            -e COACH_JWT_SECRET="$(openssl rand -hex 32)" gym-api:ci
          docker run -d --name hr --network host -e DATABASE_URL=$db -e PORT=3001 \
            -e JWT_SECRET="$(openssl rand -hex 32)" hr-api:ci
          for url in http://localhost:8056/health http://localhost:3001/api/health; do
            for i in $(seq 1 30); do curl -fsS "$url" && echo && continue 2; sleep 2; done
            echo "::error::$url did not become healthy"
            docker logs api; docker logs hr
            exit 1
          done
